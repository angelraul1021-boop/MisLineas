services:
  app:
    image: ghcr.io/moraxh/mislineas:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sitios de otros proyectos que comparten este Caddy (ver Caddyfile).
      # Carpeta compartida a nivel de VPS, fuera de este repo: la ruta exacta
      # y su contenido los define/actualiza cada proyecto por su cuenta.
      - /srv/caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
      # Red externa donde otros proyectos publican sus propios contenedores
      # (ver Caddyfile / import). Este Caddy necesita estar en esa red para
      # poder hacer reverse_proxy hacia ellos por nombre de contenedor.
      - osrm-proxy
    depends_on:
      - app

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup app
    environment:
      - WATCHTOWER_LABEL_ENABLE=false

networks:
  web:
  # Creada fuera de este compose (docker network create osrm-proxy) porque
  # otros proyectos también se unen a ella desde sus propios compose files.
  osrm-proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
